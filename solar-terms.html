<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>24 Solar Terms — Willake Woods</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

:root{
    --fg:#f7f6f1;
    --glass:rgba(12,12,12,.22);
    --glass-border:rgba(255,255,255,.18);
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:#070807;
    color:var(--fg);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    cursor:none;
}

body{
    opacity:0;
    animation:pageIn 1.8s cubic-bezier(.22,.61,.36,1) .05s forwards;
}
@keyframes pageIn{to{opacity:1;}}

/* ===== 动态虚化背景 ===== */
.bg-layer{position:fixed;inset:-10%;z-index:0;overflow:hidden;pointer-events:none;}
.bg-blur{
    width:100%;height:100%;
    object-fit:cover;
    filter:blur(60px) brightness(.4) saturate(1.2);
    transform:scale(1.2);
    transition:opacity 1.5s ease;
}
.bg-overlay{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.65));
}

/* ===== 导航栏：修复遮挡 ===== */
header{
    position:fixed;top:0;left:0;right:0;
    height:82px; /* 保持高度 */
    display:flex;align-items:flex-end;justify-content:center; /* 底部对齐 */
    padding-bottom:12px; /* 关键：给导航球留出底部空间，不压标题 */
    z-index:100;
    pointer-events:none;
    opacity:1;
    transition:opacity .6s cubic-bezier(.22,.61,.36,1);
}

.menu{
    display:flex;gap:2px;padding:4px;
    border:1px solid var(--glass-border);
    border-radius:999px;
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(135%);
    -webkit-backdrop-filter:blur(18px) saturate(135%);
    box-shadow:inset 0 1px rgba(255,255,255,.14), 0 12px 38px rgba(0,0,0,.18);
    animation:navIn 1.4s cubic-bezier(.22,.61,.36,1) .3s both;
    pointer-events:auto;
}
@keyframes navIn{
    from{opacity:0;transform:translateY(-14px);}
    to{opacity:1;transform:translateY(0);}
}

.menu a{
    color:rgba(255,255,255,.82);
    text-decoration:none;
    font-size:11px;
    padding:0 13px;min-height:32px;
    display:flex;align-items:center;
    border-radius:999px;
    transition:.35s cubic-bezier(.22,.61,.36,1);
}
.menu a:hover{
    color:#fff;
    background:rgba(255,255,255,.12);
    box-shadow:inset 0 1px rgba(255,255,255,.22), 0 6px 22px rgba(255,255,255,.045);
    transform:translateY(-1px) scale(1.045);
}
.menu a:active{transform:scale(.91);background:rgba(255,255,255,.21);}
.menu a.active{color:#fff;}

/* ===== 主体布局：修复垂直居中 ===== */
main{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding-top:82px; /* 关键：避开导航栏高度 */
    padding-bottom:80px; /* 关键：避开底部时间轴 */
    pointer-events:none;
}

.kicker{
    font-size:10px;letter-spacing:.4em;
    opacity:.5;text-transform:uppercase;
    margin-bottom:12px;
}

.title{
    font-family:"Avenir Next","SF Pro Rounded",Arial,sans-serif;
    font-weight:300;
    font-size:clamp(36px,5vw,64px); /* 稍微缩小防止顶格 */
    letter-spacing:-.055em;
    line-height:1;
    text-align:center;
    animation:textReveal 1.5s .4s both;
}
@keyframes textReveal{
    from{opacity:0;transform:translateY(22px);filter:blur(8px);}
    to{opacity:1;transform:translateY(0);filter:blur(0);}
}

.dynamic-poem{
    margin-top:10px;
    font-size:12px;letter-spacing:.2em;
    opacity:.4;
}

/* ===== 16:9 图片：修复箭头定位 ===== */
.viewer{
    position:relative;
    margin-top:20px;
    width:min(88vw,960px);
    aspect-ratio:16/9;
    border-radius:4px;overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.6);
    pointer-events:auto;
}
.photo{
    width:100%;height:100%;
    object-fit:cover;
    opacity:0;transform:scale(1.05);
    transition:opacity .8s ease,transform 1.2s cubic-bezier(.22,.61,.36,1);
}
.photo.active{opacity:1;transform:scale(1);}

/* ===== 信息区：修复底部遮挡 ===== */
.info{
    margin-top:20px;
    text-align:center;
    pointer-events:auto;
    min-height:80px; /* 防止切换跳动 */
}
.term-name{font-size:clamp(20px,3vw,28px);font-weight:300;letter-spacing:.05em;}
.term-en{font-size:11px;opacity:.5;letter-spacing:.2em;margin-top:6px;text-transform:uppercase;}
.term-hou{font-size:12px;opacity:.6;margin-top:8px;letter-spacing:.05em;font-weight:300;}

/* ===== 底部时间轴：修复遮挡 ===== */
.timeline{
    position:fixed;bottom:30px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:6px;padding:10px 16px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px);
    z-index:100;
    opacity:1;
    transition:opacity .6s cubic-bezier(.22,.61,.36,1);
    max-width:90vw;overflow-x:auto;
}
.dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.3);
    cursor:pointer;transition:.3s;flex-shrink:0;
}
.dot.active{width:24px;border-radius:10px;background:#fff;}

/* ===== 箭头：修复位置 ===== */
.arrow{
    position:fixed;
    top:50%; /* 垂直居中 */
    transform:translateY(-50%);
    width:50px;height:50px;border-radius:50%;
    border:1px solid var(--glass-border);
    background:var(--glass);
    backdrop-filter:blur(10px);
    color:#fff;font-size:24px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:100;opacity:1;
    transition:opacity .6s cubic-bezier(.22,.61,.36,1),background .3s;
}
.arrow:hover{background:rgba(255,255,255,.2);}
.left{left:30px;} 
.right{right:30px;}

/* ===== 隐藏态 ===== */
.ui-hidden header,
.ui-hidden .arrow,
.ui-hidden .timeline{opacity:0;pointer-events:none;}

/* ===== 移动端修复 ===== */
@media(max-width:700px){
    header{height:70px;padding-bottom:10px;}
    .menu{gap:2px;padding:3px;}
    .menu a{padding:0 10px;font-size:9px;min-height:28px;}
    
    main{padding-top:70px;padding-bottom:70px;} /* 移动端留出更多空间 */
    
    .viewer{width:94vw;margin-top:15px;}
    
    /* 箭头：移动端改为底部角落，绝不挡字 */
    .arrow{
        top:auto; /* 取消垂直居中 */
        bottom:90px; /* 放在时间轴上方 */
        transform:none;
        width:40px;height:40px;font-size:18px;
    }
    .left{left:15px;} 
    .right{right:15px;}
    
    .timeline{bottom:15px;padding:8px 12px;}
    .info{margin-top:12px;}
}
</style>
</head>

<body>

<div class="bg-layer">
    <img class="bg-blur" id="bgBlur" src="terms-01.webp">
    <div class="bg-overlay"></div>
</div>

<header>
    <nav class="menu">
        <a href="index.html">Home</a>
        <a href="annual-archive.html">Annual Archive</a>
        <a href="solar-terms.html" class="active">12 Months</a>
        <a href="others.html">Others</a>
    </nav>
</header>

<main>
    <div class="kicker">TIME WILL TELL</div>
    <h1 class="title">24 Solar Terms</h1>
    <div class="dynamic-poem" id="poem">春雨驚春清穀天</div>

    <div class="viewer">
        <img class="photo active" id="photo" src="terms-01.webp">
    </div>

    <div class="info">
        <div class="term-name" id="name">立春</div>
        <div class="term-en" id="en">Beginning of Spring</div>
        <div class="term-hou" id="hou">東風解凍 · 蟄蟲始振 · 魚陟負冰</div>
    </div>
</main>

<button class="arrow left" id="prev">‹</button>
<button class="arrow right" id="next">›</button>
<div class="timeline" id="timeline"></div>

<script>
const terms = [
  {zh:"立春",en:"Beginning of Spring",poem:"春雨驚春清穀天",hou:"東風解凍 · 蟄蟲始振 · 魚陟負冰"},
  {zh:"雨水",en:"Rain Water",poem:"春雨驚春清穀天",hou:"獺祭魚 · 鴻雁來 · 草木萌動"},
  {zh:"驚蟄",en:"Awakening of Insects",poem:"春雨驚春清穀天",hou:"桃始華 · 倉庚鳴 · 鷹化為鳩"},
  {zh:"春分",en:"Spring Equinox",poem:"春雨驚春清穀天",hou:"玄鳥至 · 雷乃發聲 · 始電"},
  {zh:"清明",en:"Pure Brightness",poem:"春雨驚春清穀天",hou:"桐始華 · 田鼠化為鴽 · 虹始見"},
  {zh:"穀雨",en:"Grain Rain",poem:"春雨驚春清穀天",hou:"萍始生 · 鳴鳩拂其羽 · 戴勝降於桑"},
  {zh:"立夏",en:"Beginning of Summer",poem:"夏滿芒夏暑相連",hou:"螻蟈鳴 · 蚯蚓出 · 王瓜生"},
  {zh:"小滿",en:"Grain Buds",poem:"夏滿芒夏暑相連",hou:"苦菜秀 · 靡草死 · 麥秋至"},
  {zh:"芒種",en:"Grain in Ear",poem:"夏滿芒夏暑相連",hou:"螳螂生 · 鵙始鳴 · 反舌無聲"},
  {zh:"夏至",en:"Summer Solstice",poem:"夏滿芒夏暑相連",hou:"鹿角解 · 蜩始鳴 · 半夏生"},
  {zh:"小暑",en:"Minor Heat",poem:"夏滿芒夏暑相連",hou:"溫風至 · 蟋蟀居壁 · 鷹始摯"},
  {zh:"大暑",en:"Major Heat",poem:"夏滿芒夏暑相連",hou:"腐草為螢 · 土潤溽暑 · 大雨時行"},
  {zh:"立秋",en:"Beginning of Autumn",poem:"秋處露秋寒霜降",hou:"涼風至 · 白露生 · 寒蟬鳴"},
  {zh:"處暑",en:"End of Heat",poem:"秋處露秋寒霜降",hou:"鷹乃祭鳥 · 天地始肅 · 禾乃登"},
  {zh:"白露",en:"White Dew",poem:"秋處露秋寒霜降",hou:"鴻雁來 · 玄鳥歸 · 群鳥養羞"},
  {zh:"秋分",en:"Autumn Equinox",poem:"秋處露秋寒霜降",hou:"雷始收聲 · 蟄蟲坯戶 · 水始涸"},
  {zh:"寒露",en:"Cold Dew",poem:"秋處露秋寒霜降",hou:"鴻雁來賓 · 雀入大水為蛤 · 菊有黃華"},
  {zh:"霜降",en:"Frost Descent",poem:"秋處露秋寒霜降",hou:"豺乃祭獸 · 草木黃落 · 蟄蟲咸俯"},
  {zh:"立冬",en:"Beginning of Winter",poem:"冬雪雪冬小大寒",hou:"水始冰 · 地始凍 · 雉入大水為蜃"},
  {zh:"小雪",en:"Minor Snow",poem:"冬雪雪冬小大寒",hou:"虹藏不見 · 天氣上升地氣降 · 閉塞而成冬"},
  {zh:"大雪",en:"Major Snow",poem:"冬雪雪冬小大寒",hou:"鶡鴠不鳴 · 虎始交 · 荔挺出"},
  {zh:"冬至",en:"Winter Solstice",poem:"冬雪雪冬小大寒",hou:"蚯蚓結 · 麋角解 · 水泉動"},
  {zh:"小寒",en:"Minor Cold",poem:"冬雪雪冬小大寒",hou:"雁北鄉 · 鵲始巢 · 雉始雊"},
  {zh:"大寒",en:"Major Cold",poem:"冬雪雪冬小大寒",hou:"雞乳 · 征鳥厲疾 · 水澤腹堅"}
];

let current=0, hideTimer;
const body=document.body;
const photo=document.getElementById("photo");
const bgBlur=document.getElementById("bgBlur");
const nameEl=document.getElementById("name");
const enEl=document.getElementById("en");
const houEl=document.getElementById("hou");
const poemEl=document.getElementById("poem");
const timeline=document.getElementById("timeline");

terms.forEach((_,i)=>{
  const d=document.createElement("div");
  d.className="dot";
  d.onclick=()=>show(i);
  timeline.appendChild(d);
});

function show(i){
  current=i;
  photo.classList.remove("active");
  setTimeout(()=>{
    const src=`terms-${String(i+1).padStart(2,"0")}.webp`;
    photo.src=src;
    bgBlur.src=src;
    nameEl.textContent=terms[i].zh;
    enEl.textContent=terms[i].en;
    houEl.textContent=terms[i].hou;
    poemEl.textContent=terms[i].poem;
    photo.onload=()=>photo.classList.add("active");
  },300);
  document.querySelectorAll(".dot").forEach((d,x)=>d.classList.toggle("active",x===i));
  resetHideTimer();
}

const next=()=>show((current+1)%24);
const prev=()=>show((current-1+24)%24);
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown")next();
  if(e.key==="ArrowLeft"||e.key==="ArrowUp")prev();
});

let tx=0,ty=0;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>50)dx<0?next():prev();}
  else{if(Math.abs(dy)>50)dy<0?next():prev();}
},{passive:true});

function resetHideTimer(){
  body.classList.remove("ui-hidden");
  document.body.style.cursor="default";
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{
    body.classList.add("ui-hidden");
    document.body.style.cursor="none";
  },3000);
}
["mousemove","mousedown","keydown","touchstart"].forEach(ev=>
  document.addEventListener(ev,resetHideTimer,{passive:true}));

show(0);
resetHideTimer();
</script>
</body>
</html>
