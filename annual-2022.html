<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>2022 — Annual Picture · Willake Woods</title>
<link
    rel="stylesheet"
    href="annual.css"
>
<style>
/* =========================================================
   WILLAKE WOODS — SHARED LIQUID GLASS NAVIGATION
   Same visual language as index.html
========================================================= */
.annual-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
    height:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}
/* ---------------------------------------------------------
   BRAND
--------------------------------------------------------- */
.annual-brand{
    position:absolute;
    left:34px;
    color:#fff;
    text-decoration:none;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    font-size:12px;
    opacity:.78;
    transition:
        opacity .35s
        cubic-bezier(.22,.61,.36,1);
        
    pointer-events:auto;
}
.annual-brand:hover{
    opacity:1;
}
/* ---------------------------------------------------------
   LIQUID GLASS NAV
--------------------------------------------------------- */
.annual-nav{
    display:flex;
    align-items:center;
    gap:2px;
    padding:4px;
    border:
        1px solid
        rgba(255,255,255,.18);
    border-radius:999px;
    background:
        rgba(12,12,12,.22);
    backdrop-filter:
        blur(18px)
        saturate(135%);
    -webkit-backdrop-filter:
        blur(18px)
        saturate(135%);
    box-shadow:
        inset 0 1px
        rgba(255,255,255,.14),
        0 12px 38px
        rgba(0,0,0,.18);
    animation:
        annualNavIn
        1.4s
        cubic-bezier(.22,.61,.36,1)
        .3s
        both;
    pointer-events:auto;
}
/* ---------------------------------------------------------
   NAV ITEMS
--------------------------------------------------------- */
.annual-nav a{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:32px;
    padding:
        0 13px;
    border-radius:999px;
    color:
        rgba(255,255,255,.82);
    text-decoration:none;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    font-size:11px;
    font-weight:400;
    white-space:nowrap;
    transition:
        color .35s
        cubic-bezier(.22,.61,.36,1),
        background .35s
        cubic-bezier(.22,.61,.36,1),
        box-shadow .35s
        cubic-bezier(.22,.61,.36,1),
        transform .35s
        cubic-bezier(.22,.61,.36,1);
}
/* ---------------------------------------------------------
   HOVER — LIQUID GLASS
--------------------------------------------------------- */
.annual-nav a:hover{
    color:#fff;
    background:
        rgba(255,255,255,.12);
    box-shadow:
        inset 0 1px
        rgba(255,255,255,.22),
        0 6px 22px
        rgba(255,255,255,.045);
    transform:
        translateY(-1px)
        scale(1.045);
}
/* ---------------------------------------------------------
   ACTIVE / PRESS
--------------------------------------------------------- */
.annual-nav a:active{
    transform:
        scale(.91);
    background:
        rgba(255,255,255,.21);
    box-shadow:
        inset 0 1px 8px
        rgba(255,255,255,.14);
}
/* ---------------------------------------------------------
   NAV ENTRANCE
--------------------------------------------------------- */
@keyframes annualNavIn{
    from{
        opacity:0;
        transform:
            translateY(-18px);
    }
    to{
        opacity:1;
        transform:
            translateY(0);
    }
}
/* ---------------------------------------------------------
   MOBILE
--------------------------------------------------------- */
@media(max-width:700px){
    .annual-header{
        height:auto;
        min-height:68px;
        padding:
            14px
            0;
    }
    .annual-brand{
        left:17px;
        font-size:11px;
    }
    .annual-nav{
        max-width:94vw;
        flex-wrap:wrap;
        justify-content:center;
        gap:2px;
    }
    .annual-nav a{
        font-size:10px;
        padding:
            0 10px;
        min-height:35px;
    }
}
/* ---------------------------------------------------------
   REDUCED MOTION
--------------------------------------------------------- */
@media(prefers-reduced-motion:reduce){
    .annual-nav,
    .annual-nav a{
        animation-duration:.01ms !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>
<body data-year="2022">

</div>

</div>
<div class="annual-lightbox" data-lightbox>

<script src="annual.js"></script>
</body>
