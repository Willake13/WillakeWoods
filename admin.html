<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Willake Vote Admin
</title>


<style>


*{
box-sizing:border-box;
}


html,body{

margin:0;
width:100%;
height:100%;

background:#090b09;

color:#f7f6f1;

font-family:
Inter,
-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial;

}



body{

display:flex;
justify-content:center;
align-items:center;

overflow:auto;

}



.bg{

position:fixed;
inset:-10%;

background:
url("photo-01.webp")
center/cover;

filter:
blur(40px)
brightness(.35);

z-index:0;

}



.bg:after{

content:"";

position:absolute;
inset:0;

background:
rgba(0,0,0,.45);

}




.panel{

position:relative;
z-index:2;

width:min(92vw,720px);

padding:42px;

border-radius:32px;


background:

rgba(255,255,255,.075);


border:

1px solid rgba(255,255,255,.16);


backdrop-filter:

blur(35px);


box-shadow:

0 40px 100px rgba(0,0,0,.5);

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

}



h1{

font-size:42px;

font-weight:300;

letter-spacing:-.06em;

margin:0;

}



.sub{

margin-top:8px;

font-size:11px;

letter-spacing:.25em;

opacity:.55;

text-transform:uppercase;

}




button{

margin-top:25px;

padding:12px 22px;

border-radius:999px;

border:

1px solid rgba(255,255,255,.25);


background:

rgba(255,255,255,.1);


color:white;

cursor:pointer;


transition:.25s;

}


button:hover{

background:

rgba(255,255,255,.2);

}




.list{

margin-top:35px;

}



.item{

display:flex;

align-items:center;

gap:18px;


padding:16px 0;


border-bottom:

1px solid rgba(255,255,255,.12);

}




.photo{

width:70px;

height:70px;

border-radius:14px;

overflow:hidden;

flex-shrink:0;

}



.photo img{

width:100%;
height:100%;

object-fit:cover;

}



.rank{

width:35px;

font-size:20px;

}



.name{

flex:1;

}



.title{

font-size:15px;

}


.small{

font-size:11px;

opacity:.5;

margin-top:4px;

}



.vote{

font-size:18px;

}



.bar{

margin-top:8px;

height:4px;

border-radius:10px;

background:

rgba(255,255,255,.12);

overflow:hidden;

}


.fill{

height:100%;

background:

rgba(255,255,255,.75);

}




.footer{

margin-top:25px;

font-size:11px;

opacity:.45;

letter-spacing:.15em;

text-align:center;

}


</style>

</head>


<body>


<div class="bg"></div>



<div class="panel">


<div class="header">

<div>

<h1>
Vote Ranking
</h1>

<div class="sub">
Willake Annual Picture 2026
</div>

</div>


<button onclick="loadVotes()">
Refresh
</button>


</div>



<div class="list" id="list">

Loading...

</div>



<div class="footer" id="time">

</div>


</div>






<script>



const API=
"https://vote.136875.xyz";


const KEY=
"200212";



const TOTAL=
13;



// 这里以后替换成你的真实照片标题

const titles=[

"Haze Of Light",

"Annual Picture 2026",

"Untitled",

"Untitled",

"Untitled",

"Untitled",

"Untitled",

"Untitled",

"Untitled",

"Untitled",

"Untitled",

"Untitled",

"Untitled"

];




async function loadVotes(){


try{


const res=
await fetch(
API+
"/admin-stats?key="+KEY
);



const data=
await res.json();



if(!data.success){

throw Error();

}



let ranking=
data.ranking;



// 没有人投票的照片补齐

for(let i=1;i<=TOTAL;i++){


if(!ranking.find(
x=>x.photo_id===i
)){

ranking.push({

photo_id:i,

votes:0

});


}

}




ranking.sort(
(a,b)=>
b.votes-a.votes
);



const max=
Math.max(
1,
ranking[0].votes
);



let html="";



ranking.forEach(
(item,index)=>{


let medal="";


if(index===0)
medal="🥇";

else if(index===1)
medal="🥈";

else if(index===2)
medal="🥉";




html+=`

<div class="item">


<div class="rank">

${medal || index+1}

</div>



<div class="photo">

<img src="photo-${String(item.photo_id).padStart(2,"0")}.webp">

</div>



<div class="name">

<div class="title">

Photo-${String(item.photo_id).padStart(2,"0")}

</div>


<div class="small">

${titles[item.photo_id-1]}

</div>



<div class="bar">

<div class="fill"

style="width:${item.votes/max*100}%">

</div>

</div>


</div>



<div class="vote">

${item.votes}

</div>



</div>


`;



});




document.getElementById("list").innerHTML=
html;



document.getElementById("time").innerHTML=

"Last update · "+
new Date()
.toLocaleTimeString();



}

catch(e){


document.getElementById("list").innerHTML=

"Network Error";


}



}




loadVotes();


setInterval(
loadVotes,
5000
);



</script>


</body>

</html>
