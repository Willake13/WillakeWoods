<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Willake Vote Admin</title>

<style>

*{
box-sizing:border-box;
}

html,body{

margin:0;
width:100%;
min-height:100%;

background:#090b09;
color:#f7f6f1;

font-family:
Inter,
-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial;

}


body{

display:flex;
justify-content:center;
align-items:center;

padding:30px;

}


.bg{

position:fixed;
inset:-10%;

background:
url("photo-01.webp")
center/cover;

filter:
blur(40px)
brightness(.35);

z-index:0;

}


.bg:after{

content:"";
position:absolute;
inset:0;

background:
rgba(0,0,0,.45);

}



.panel{

position:relative;
z-index:2;

width:min(92vw,720px);

padding:42px;

border-radius:32px;

background:
rgba(255,255,255,.075);

border:
1px solid rgba(255,255,255,.16);

backdrop-filter:
blur(35px);

box-shadow:
0 40px 100px rgba(0,0,0,.5);

}



h1{

font-size:42px;
font-weight:300;

letter-spacing:-.06em;

margin:0;

}



.sub{

margin-top:8px;

font-size:11px;

letter-spacing:.25em;

opacity:.55;

text-transform:uppercase;

}



input{

margin-top:25px;

width:100%;

padding:14px 18px;

border-radius:999px;

border:

1px solid rgba(255,255,255,.25);

background:

rgba(255,255,255,.08);

color:white;

outline:none;

}



button{

margin-top:18px;

padding:12px 25px;

border-radius:999px;

border:

1px solid rgba(255,255,255,.25);

background:

rgba(255,255,255,.1);

color:white;

cursor:pointer;

}



button:hover{

background:
rgba(255,255,255,.2);

}



#login{

text-align:center;

}



#error{

margin-top:15px;

font-size:12px;

opacity:.6;

}



.list{

margin-top:35px;

}



.item{

display:flex;

align-items:center;

gap:18px;

padding:16px 0;

border-bottom:

1px solid rgba(255,255,255,.12);

}



.rank{

width:35px;

font-size:20px;

}



.photo{

width:70px;

height:70px;

border-radius:14px;

overflow:hidden;

}



.photo img{

width:100%;
height:100%;

object-fit:cover;

}



.name{

flex:1;

}


.title{

font-size:15px;

}


.small{

font-size:11px;

opacity:.5;

margin-top:4px;

}


.bar{

margin-top:8px;

height:4px;

background:

rgba(255,255,255,.12);

border-radius:10px;

overflow:hidden;

}


.fill{

height:100%;

background:
rgba(255,255,255,.75);

}



.vote{

font-size:20px;

}



.footer{

margin-top:25px;

text-align:center;

font-size:11px;

opacity:.45;

}


.hidden{

display:none;

}


</style>

</head>


<body>


<div class="bg"></div>



<div class="panel">



<div id="login">


<h1>
Admin
</h1>


<div class="sub">
Willake Annual Picture 2026
</div>


<input
id="password"
type="password"
placeholder="Enter password">


<button onclick="login()">
Login
</button>


<div id="error"></div>


</div>





<div id="dashboard" class="hidden">


<h1>
Vote Ranking
</h1>


<div class="sub">
Willake Annual Picture 2026
</div>



<button onclick="loadVotes()">
Refresh
</button>



<div class="list" id="list">

Loading...

</div>



<div class="footer" id="time"></div>


</div>



</div>





<script>


const API =
"https://vote.136875.xyz";


const TOTAL = 13;


const titles=[

"Haze Of Light",
"Annual Picture 2026",
"Untitled",
"Untitled",
"Untitled",
"Untitled",
"Untitled",
"Untitled",
"Untitled",
"Untitled",
"Untitled",
"Untitled",
"Untitled"

];



let KEY=null;



function login(){


const value =
document.getElementById("password").value;


if(!value){

return;

}


KEY=value;


sessionStorage.setItem(
"admin-key",
value
);



checkLogin();


}




function checkLogin(){


KEY=sessionStorage.getItem(
"admin-key"
);


if(KEY){


document.getElementById("login")
.classList.add("hidden");


document.getElementById("dashboard")
.classList.remove("hidden");


loadVotes();


}

}



async function loadVotes(){


try{


const res =
await fetch(
API+
"/admin-stats?key="+
encodeURIComponent(KEY)
);



const data =
await res.json();



if(!data.success){

throw Error(
"Unauthorized"
);

}



let ranking =
data.ranking || [];



for(let i=1;i<=TOTAL;i++){


if(!ranking.some(
x=>Number(x.photo_id)===i
)){


ranking.push({

photo_id:i,

votes:0

});


}

}




ranking.sort((a,b)=>{


if(
Number(b.votes)!==
Number(a.votes)
)

return b.votes-a.votes;


return a.photo_id-b.photo_id;


});




const max =
Math.max(
1,
ranking[0].votes
);



let html="";



ranking.forEach((item,index)=>{


let medal="";


if(index===0)
medal="🥇";

else if(index===1)
medal="🥈";

else if(index===2)
medal="🥉";



html+=`

<div class="item">


<div class="rank">

${medal || index+1}

</div>



<div class="photo">

<img src="photo-${String(item.photo_id).padStart(2,"0")}.webp">

</div>



<div class="name">


<div class="title">

Photo-${String(item.photo_id).padStart(2,"0")}

</div>


<div class="small">

${titles[item.photo_id-1]}

</div>


<div class="bar">

<div class="fill"
style="
width:${item.votes/max*100}%
">

</div>

</div>


</div>


<div class="vote">

${item.votes}

</div>


</div>


`;

});


document.getElementById("list").innerHTML=
html;


document.getElementById("time").innerHTML=

"Last update · "+
new Date()
.toLocaleTimeString();


}

catch(e){


document.getElementById("list").innerHTML=
"Network Error";


}

}




checkLogin();


setInterval(()=>{

if(KEY){

loadVotes();

}

},5000);



</script>


</body>

</html>
