<title>Willake Woods — Photography</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap');


* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050505;

    color: #fff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}


body {
    opacity: 0;

    animation:
        pageIn
        1.8s
        cubic-bezier(.22,.61,.36,1)
        .05s
        forwards;
}


/* =========================================================
   BACKGROUND
========================================================= */

.bg {
    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #050505;
}


.photo {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    opacity: 0;

    filter:
        saturate(.88)
        brightness(.60);

    transform:
        scale(1.018);

    transition:
        opacity 2.2s cubic-bezier(.22,.61,.36,1),
        transform 8s cubic-bezier(.22,.61,.36,1);
}


.photo.active {
    opacity: 1;

    transform:
        scale(1);
}


/* Atmospheric overlay */

.bg:after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at 50% 47%,
            rgba(0,0,0,.18) 0%,
            rgba(0,0,0,.04) 42%,
            rgba(0,0,0,.34) 100%
        ),
        linear-gradient(
            180deg,
            rgba(0,0,0,.38),
            rgba(0,0,0,.05) 35%,
            rgba(0,0,0,.30)
        );

    pointer-events: none;
}


/* =========================================================
   MAIN
========================================================= */

main {
    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: flex-start;

    justify-content: center;

    text-align: center;

    padding:
        0
        28px;
}


.hero {
    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transform:
        translateY(-2vh);
}


/* =========================================================
   NAVIGATION
========================================================= */

.menu {
    position: absolute;

    top: 22px;
    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 2px;

    padding: 4px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:
        999px;

    background:
        rgba(12,12,12,.22);

    backdrop-filter:
        blur(18px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(135%);

    box-shadow:
        inset 0 1px rgba(255,255,255,.14),
        0 12px 38px rgba(0,0,0,.18);

    animation:
        navIn
        1.4s
        cubic-bezier(.22,.61,.36,1)
        .3s
        both;
}


.menu a {
    color:
        rgba(255,255,255,.82);

    text-decoration: none;

    font-size: 11px;

    padding:
        0
        13px;

    min-height: 32px;

    display: flex;

    align-items: center;

    border-radius:
        999px;

    transition:
        .35s
        cubic-bezier(.22,.61,.36,1);
}


.menu a:hover {
    color: #fff;

    background:
        rgba(255,255,255,.12);

    box-shadow:
        inset 0 1px rgba(255,255,255,.22),
        0 6px 22px rgba(255,255,255,.045);

    transform:
        translateY(-1px)
        scale(1.045);
}


.menu a:active {
    transform:
        scale(.91);

    background:
        rgba(255,255,255,.21);

    box-shadow:
        inset 0 1px 8px
        rgba(255,255,255,.14);
}


/* =========================================================
   TEXT
========================================================= */

.eyebrow {
    margin:
        0
        0
        12px;

    color:
        rgba(255,255,255,.78);

    font-size:
        clamp(10px,.75vw,13px);

    letter-spacing:
        .20em;

    text-shadow:
        0 2px 18px
        rgba(0,0,0,.55);

    animation:
        textIn
        1.5s
        cubic-bezier(.22,.61,.36,1)
        .7s
        both;
}


.name {
    margin: 0;

    color: #fff;

    text-decoration: none;

    font-family:
        "Avenir Next",
        "SF Pro Rounded",
        "Arial Rounded MT Bold",
        system-ui,
        sans-serif;

    font-size:
        clamp(48px,7.2vw,108px);

    line-height: .94;

    font-weight: 650;

    letter-spacing:
        -.045em;

    text-shadow:
        0 4px 28px
        rgba(0,0,0,.48),
        0 1px 2px
        rgba(0,0,0,.32);

    animation:
        nameIn
        1.8s
        cubic-bezier(.22,.61,.36,1)
        .88s
        both;
}


.name:hover {
    text-shadow:
        0 5px 45px
        rgba(255,255,255,.18);
}


.motto {
    margin:
        clamp(20px,3vh,34px)
        0
        0;

    color:
        rgba(255,255,255,.82);

    font-size:
        clamp(13px,1vw,16px);

    font-weight: 400;

    letter-spacing:
        .24em;

    text-shadow:
        0 2px 18px
        rgba(0,0,0,.55);

    animation:
        textIn
        1.6s
        cubic-bezier(.22,.61,.36,1)
        1.25s
        both;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: fixed;

    z-index: 5;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    display: flex;

    gap: 6px;

    animation:
        fade
        1.4s
        ease
        2s
        both;
}


.progress span {
    width: 4px;
    height: 4px;

    border-radius: 99px;

    background:
        rgba(255,255,255,.28);

    transition:
        .5s;
}


.progress span.active {
    width: 18px;

    background:
        rgba(255,255,255,.82);
}


/* =========================================================
   YEAR ENTRY
========================================================= */

.year-entry {
    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    margin-top:
        clamp(25px,3.4vh,36px);

    min-width: 154px;

    height: 36px;

    padding:
        0
        13px
        0
        11px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:
        999px;

    color:
        rgba(255,255,255,.82);

    text-decoration: none;

    background:
        rgba(255,255,255,.045);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.12),
        0 10px 28px
        rgba(0,0,0,.14);

    backdrop-filter:
        blur(18px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(140%);

    overflow: hidden;

    transition:
        transform .45s cubic-bezier(.22,.61,.36,1),
        background .4s ease,
        border-color .4s ease,
        box-shadow .4s ease;

    animation:
        liquidIn
        1.3s
        cubic-bezier(.22,.61,.36,1)
        1.55s
        both;
}


.year-entry::before {
    content: "";

    position: absolute;

    left: -30%;
    top: -80%;

    width: 55%;
    height: 260%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.09);

    filter:
        blur(13px);

    transform:
        translateX(-15%);

    transition:
        transform .7s cubic-bezier(.22,.61,.36,1),
        opacity .4s ease;

    opacity: .35;
}


.year-dot {
    position: relative;

    z-index: 1;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.72);

    box-shadow:
        0 0 10px
        rgba(255,255,255,.22);

    transition:
        transform .45s cubic-bezier(.22,.61,.36,1),
        background .35s ease;
}


.year-label {
    position: relative;

    z-index: 1;

    font-size: 11px;

    font-weight: 500;

    letter-spacing: .08em;

    white-space: nowrap;
}


.year-arrow {
    position: relative;

    z-index: 1;

    font-size: 13px;

    opacity: .58;

    transform:
        translateX(0);

    transition:
        transform .45s cubic-bezier(.22,.61,.36,1),
        opacity .35s ease;
}


.year-entry:hover {
    transform:
        translateY(-2px)
        scale(1.045);

    color: #fff;

    background:
        rgba(255,255,255,.095);

    border-color:
        rgba(255,255,255,.23);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.20),
        0 14px 38px
        rgba(0,0,0,.20),
        0 0 24px
        rgba(255,255,255,.045);
}


.year-entry:hover::before {
    transform:
        translateX(230%);

    opacity: .72;
}


.year-entry:hover .year-dot {
    transform:
        scale(1.5);

    background:
        #fff;
}


.year-entry:hover .year-arrow {
    transform:
        translateX(4px);

    opacity: .95;
}


.year-entry:active {
    transform:
        translateY(0)
        scale(.94);

    background:
        rgba(255,255,255,.15);
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes pageIn {

    to {
        opacity: 1;
    }

}


@keyframes navIn {

    from {
        opacity: 0;

        transform:
            translate(-50%,-18px);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%,0);
    }

}


@keyframes textIn {

    from {
        opacity: 0;

        filter:
            blur(10px);

        transform:
            translateY(12px);
    }

    to {
        opacity: 1;

        filter:
            blur(0);

        transform:
            none;
    }

}


@keyframes nameIn {

    from {
        opacity: 0;

        filter:
            blur(18px);

        transform:
            translateY(18px)
            scale(.985);
    }

    to {
        opacity: 1;

        filter:
            blur(0);

        transform:
            none;
    }

}


@keyframes fade {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes liquidIn {

    from {
        opacity: 0;

        filter:
            blur(9px);

        transform:
            translateY(12px)
            scale(.92);
    }

    to {
        opacity: 1;

        filter:
            blur(0);

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    .menu {
        top: 14px;

        width: max-content;
        max-width: calc(100vw - 24px);

        flex-wrap: nowrap;
        justify-content: center;
        gap: 1px;

        padding: 3px;

        overflow: visible;
    }


    .menu a {
        flex: 0 0 auto;

        font-size: 9px;

        padding: 0 7px;

        min-height: 32px;

        white-space: nowrap;
    }


    .name {
        font-size:
            14vw;
    }


    .photo {
        filter:
            saturate(.88)
            brightness(.57);
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion:reduce) {

    * {
        animation-duration:
            .01ms !important;

        transition-duration:
            .01ms !important;
    }

}

</style>

</head>

<!-- =======================================================
     HOMEPAGE JAVASCRIPT
======================================================= -->

<script>

const photos =
    document.querySelectorAll(".photo");

const dots =
    document.querySelectorAll(".progress span");


let current = 0;


function showPhoto(n) {

    photos[current]
        .classList
        .remove("active");

    dots[current]
        .classList
        .remove("active");


    current =
        (n + photos.length)
        % photos.length;


    photos[current]
        .classList
        .add("active");

    dots[current]
        .classList
        .add("active");

}


/* Preload homepage images */

photos.forEach(photo => {

    const image =
        new Image();

    image.src =
        photo.src;

});


/* Automatic slideshow */

setInterval(
    () => showPhoto(current + 1),
    6500
);


/* Click background to advance */

document
    .querySelector(".bg")
    .addEventListener(
        "click",
        () => showPhoto(current + 1)
    );

</script>
